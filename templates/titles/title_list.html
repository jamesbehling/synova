{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Titles</h2>
        <a href="{% url 'title_add' %}" class="btn btn-primary">Add Title</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for title in object_list %}
                <tr>
                    <td>{{ title.name }}</td>
                    <td>
                        <a href="{% url 'title_edit' title.pk %}" class="btn btn-sm btn-outline-primary">Edit</a>
                        <a href="{% url 'title_delete' title.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="7" class="text-center text-muted">No titles found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
